[project]
name = "atera-sync"
version = "0.1.0"
description = "Resolve Atera alert-generated tickets when alerts are resolved"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx==0.27.2",
  "pydantic==2.8.2",
  "tenacity==9.0.0",
  "typer==0.12.5",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.2",
]

[project.scripts]
atera-sync = "atera_sync.cli:app"

[tool.pytest.ini_options]
addopts = "-q"
